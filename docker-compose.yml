services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnhunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vulnhunt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnhunt} -d ${POSTGRES_DB:-vulnhunt}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vulnhunt:
    image: ${VULNHUNT_IMAGE:-ruoji6/vulnhunt}:${VULNHUNT_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VULNHUNT_PG_DSN: postgres://${POSTGRES_USER:-vulnhunt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnhunt}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 首次启动自动创建管理员密码（已有密码不覆盖）。容器内 /setup 的请求
      # 源地址不是回环，未设置该变量时首次初始化会被拒绝。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VULNHUNT_LLM_PROVIDER: ${VULNHUNT_LLM_PROVIDER:-}
      VULNHUNT_LLM_MODEL: ${VULNHUNT_LLM_MODEL:-}
      VULNHUNT_LLM_BASE_URL: ${VULNHUNT_LLM_BASE_URL:-}
      VULNHUNT_LLM_PROXY: ${VULNHUNT_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
